<script>
document.addEventListener("DOMContentLoaded", async () => {

  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyqus8iHE46YshnIW0CAr_-o2Suq1Yw7t1wcEblfxTb1r_35h4fNmztqPMusNu6UsOC-hutPIAboYl/pub?gid=0&single=true&output=csv";

  const DEFAULT_VIDEOS = [
    "https://www.youtube.com/embed/jy9yQvJ6I_k"
  ];

  const ytplayer = document.getElementById("ytplayer");
  const nextBtn  = document.getElementById("nextBtn");
  const prevBtn  = document.getElementById("prevBtn");

  function extractYouTubeId(url) {
    if (!url) return null;
    url = url.trim();

    let m;
    if ((m = url.match(/youtu\.be\/([A-Za-z0-9_-]+)/))) return m[1];
    if ((m = url.match(/[?&]v=([A-Za-z0-9_-]+)/))) return m[1];
    if ((m = url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]+)/))) return m[1];
    if ((m = url.match(/youtube\.com\/embed\/([A-Za-z0-9_-]+)/))) return m[1];
    return null;
  }

  function toEmbedUrl(raw) {
    const id = extractYouTubeId(raw);
    return id ? `https://www.youtube.com/embed/${id}` : null;
  }

  async function loadVideos() {
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      const csv = await res.text();
      const lines = csv.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const urls = (lines[0]?.toLowerCase() === "url") ? lines.slice(1) : lines;
      const embeds = urls.map(toEmbedUrl).filter(Boolean);
      return embeds.length ? embeds : DEFAULT_VIDEOS;
    } catch {
      return DEFAULT_VIDEOS;
    }
  }

  let videos = await loadVideos();
  let currentIndex = Math.floor(Math.random() * videos.length);
  ytplayer.src = videos[currentIndex];

  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % videos.length;
    ytplayer.src = videos[currentIndex];
  });

  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + videos.length) % videos.length;
    ytplayer.src = videos[currentIndex];
  });

});
</script>
